# AI 软件工厂控制平面 —— 应用配置
# v1.2 边界：Spring Boot 只绑定 loopback；PostgreSQL 是唯一权威关系数据库。
server:
  port: 8420
  address: 127.0.0.1

spring:
  application:
    name: sdlc-factory-control-plane
  # 虚拟线程：请求处理与阻塞 IO 使用虚拟线程（JDK 21+ 定型特性）
  threads:
    virtual:
      enabled: true
  # 全局 JSON 采用 snake_case，与机器合同字段命名一致
  jackson:
    property-naming-strategy: SNAKE_CASE
    # Boot 4 / Jackson 3 默认以 ISO-8601 输出时间；旧 WRITE_DATES_AS_TIMESTAMPS 特性已移除。
  datasource:
    # 连接参数通过环境变量注入；Secret 不落配置文件明文
    url: ${FACTORY_DB_URL:jdbc:postgresql://localhost:5432/sdlc_factory}
    username: ${FACTORY_DB_USER:factory}
    password: ${FACTORY_DB_PASSWORD:factory}
  flyway:
    # 迁移文件来自 contracts/ddl 的唯一 DDL 事实源（构建期复制进 classpath）
    enabled: true
    locations: classpath:db/migration

# MyBatis-Plus：简单 CRUD 走 BaseMapper，复杂多表 SQL 走 XML
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.sdlc.factory: INFO
