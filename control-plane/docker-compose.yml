name: sdlc-factory

services:
  postgres:
    image: postgres:16-alpine
    container_name: sdlc-factory-postgres
    restart: unless-stopped
    environment:
      # 仅用于本机开发，与 application.yml 的默认连接参数保持一致。
      POSTGRES_DB: sdlc_factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
    ports:
      # 只绑定 loopback，数据库不暴露到局域网。
      - "127.0.0.1:5432:5432"
    volumes:
      # 命名卷保留数据库状态，停止或重建容器不会删除数据。
      - factory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d sdlc_factory"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  factory-postgres-data:
