<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#172b4d"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#de350b"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b4d}
      .title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#5e6c84}.head{font-size:18px;font-weight:700}
      .label{font-size:15px;font-weight:700;text-anchor:middle}.small{font-size:13px;fill:#5e6c84;text-anchor:middle}
      .box{stroke-width:2;rx:11}.edge{fill:none;stroke:#172b4d;stroke-width:2.2;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="#fff"/>
  <text x="50" y="62" class="title">Task 正交状态模型：业务阶段、运行状态、门禁状态分离</text>
  <text x="50" y="94" class="sub">Suspension 覆盖当前业务阶段并记录 resume_stage；Operation/Gate 失败由领域矩阵决定返工、挂起或保持阶段</text>

  <rect x="50" y="135" width="1700" height="210" rx="16" fill="#f4f5f7" stroke="#7a869a" stroke-width="2"/>
  <text x="80" y="170" class="head">TaskStage：批准、交付与回滚边界</text>
  <g>
    <rect x="75" y="210" width="180" height="80" class="box" fill="#deebff" stroke="#0052cc"/>
    <rect x="285" y="210" width="180" height="80" class="box" fill="#fffae6" stroke="#ff991f"/>
    <rect x="495" y="210" width="180" height="80" class="box" fill="#eae6ff" stroke="#6554c0"/>
    <rect x="705" y="210" width="180" height="80" class="box" fill="#fffae6" stroke="#ff991f"/>
    <rect x="915" y="210" width="180" height="80" class="box" fill="#e6fcff" stroke="#00a3bf"/>
    <rect x="1125" y="210" width="180" height="80" class="box" fill="#fffae6" stroke="#ff991f"/>
    <rect x="1335" y="210" width="180" height="80" class="box" fill="#e3fcef" stroke="#00875a"/>
    <rect x="1545" y="210" width="180" height="80" class="box" fill="#ffebe6" stroke="#de350b"/>
  </g>
  <text x="165" y="258" class="label">Draft</text>
  <text x="375" y="247" class="label"><tspan x="375">Awaiting</tspan><tspan x="375" dy="20">SpecApproval</tspan></text>
  <text x="585" y="258" class="label">Implementing</text>
  <text x="795" y="247" class="label"><tspan x="795">Awaiting</tspan><tspan x="795" dy="20">HumanReview</tspan></text>
  <text x="1005" y="258" class="label">Accepting</text>
  <text x="1215" y="247" class="label"><tspan x="1215">Awaiting</tspan><tspan x="1215" dy="20">DeliveryApproval</tspan></text>
  <text x="1425" y="258" class="label">Finalized</text>
  <text x="1635" y="246" class="label">Cancelled</text><text x="1635" y="270" class="small">任一未终态经 Operator</text>
  <path d="M255 250 H285" class="edge"/><path d="M465 250 H495" class="edge"/>
  <path d="M675 250 H705" class="edge"/><path d="M885 250 H915" class="edge"/>
  <path d="M1095 250 H1125" class="edge"/><path d="M1305 250 H1335" class="edge"/>

  <rect x="180" y="390" width="1440" height="120" rx="16" fill="#ffebe6" stroke="#de350b" stroke-width="2"/>
  <text x="900" y="426" class="head" text-anchor="middle" fill="#bf2600">Suspension：不是 TaskStage</text>
  <text x="900" y="458" class="sub" text-anchor="middle">code · category · resume_stage · decision_required · retry_after · evidence_ref</text>
  <text x="900" y="486" class="sub" text-anchor="middle">环境、策略、revision 漂移、预算耗尽、重复失败或未知故障均保留原阶段；解除后只能返回记录的 resume_stage。</text>
  <path d="M585 290 V390" fill="none" stroke="#de350b" stroke-width="2.2" marker-end="url(#ar)" stroke-dasharray="7 6"/>
  <path d="M1005 290 V390" fill="none" stroke="#de350b" stroke-width="2.2" marker-end="url(#ar)" stroke-dasharray="7 6"/>

  <rect x="50" y="560" width="825" height="250" rx="16" fill="#eae6ff" stroke="#6554c0" stroke-width="2"/>
  <text x="80" y="598" class="head">OperationStatus：长运行、租约、心跳、取消和恢复</text>
  <g fill="#fff" stroke="#6554c0">
    <rect x="85" y="650" width="115" height="62" class="box"/><rect x="220" y="650" width="115" height="62" class="box"/>
    <rect x="355" y="650" width="115" height="62" class="box"/><rect x="490" y="650" width="115" height="62" class="box"/>
    <rect x="625" y="650" width="115" height="62" class="box"/><rect x="760" y="650" width="85" height="62" class="box"/>
  </g>
  <text x="142" y="688" class="label">Pending</text><text x="277" y="688" class="label">Running</text>
  <text x="412" y="688" class="label">Succeeded</text><text x="547" y="688" class="label">Failed</text>
  <text x="682" y="688" class="label">Suspended</text><text x="802" y="688" class="label">Cancelled</text>
  <text x="462" y="760" class="small">Host 断开不取消 Operation；相同副作用步骤接管前必须检查 lease、进程树和 Evidence。</text>

  <rect x="925" y="560" width="825" height="250" rx="16" fill="#e6fcff" stroke="#00a3bf" stroke-width="2"/>
  <text x="955" y="598" class="head">GateStatus：确定性输入与 Evidence 新鲜度</text>
  <g fill="#fff" stroke="#00a3bf">
    <rect x="960" y="650" width="115" height="62" class="box"/><rect x="1095" y="650" width="115" height="62" class="box"/>
    <rect x="1230" y="650" width="115" height="62" class="box"/><rect x="1365" y="650" width="115" height="62" class="box"/>
    <rect x="1500" y="650" width="100" height="62" class="box"/><rect x="1620" y="650" width="100" height="62" class="box"/>
  </g>
  <text x="1017" y="688" class="label">Pending</text><text x="1152" y="688" class="label">Running</text>
  <text x="1287" y="688" class="label">Passed</text><text x="1422" y="688" class="label">Failed</text>
  <text x="1550" y="688" class="label">Stale</text><text x="1670" y="688" class="label">Cancelled</text>
  <text x="1337" y="760" class="small">只有 input_digest 相同且 Evidence 完整的 Passed GateRun 可以复用；未知变化保守失效。</text>

  <rect x="180" y="860" width="1440" height="105" rx="14" fill="#f4f5f7" stroke="#7a869a" stroke-width="2"/>
  <text x="900" y="898" class="head" text-anchor="middle">领域矩阵是不变量</text>
  <text x="900" y="930" class="sub" text-anchor="middle">Event → Guard → TaskStage · Event → Gate/Approval Invalidation · Suspension → Resume</text>
  <text x="900" y="955" class="small">模型只能提交 observation 和候选内容；不能传入目标阶段、伪造人工 Receipt 或覆盖失效计算。</text>
  <text x="50" y="1055" class="sub">可编辑源文件：SDLC-Pipeline-1.0-Architecture.drawio · 第 3 页</text>
</svg>
