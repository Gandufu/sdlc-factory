apiVersion: sdlc.dev/approval-invalidation/v1alpha1
kind: ApprovalInvalidationMatrix

globalRules:
  historicalReceiptsAreImmutable: true
  staleReceiptsMayAuthorizeActions: false
  unknownRelevantChange: stale
  activeDeliveryApprovalLimit: 1

approvals:
  - approval: spec
    subject:
      - proposal_hash
      - slice_plan_hash
      - fact_change_set_hash
      - base_facts_revision
      - base_workspace_revision
      - policy_digest
      - interface_requirement_digest
    invalidations:
      - change: proposal_or_slice_plan
        result: stale
        nextStage: Draft
        error: SPEC_APPROVAL_STALE
      - change: fact_change_set
        result: stale
        nextStage: Draft
        error: SPEC_APPROVAL_STALE
      - change: base_facts_or_relevant_interface
        result: stale
        nextStage: Draft
        error: REVISION_DRIFT
      - change: external_workspace_drift
        result: stale
        nextStage: unchanged
        suspension: revision
        error: REVISION_DRIFT
      - change: authorized_task_delta_within_approved_scope
        result: keep
    notes:
      - Implementation changes produced after approval do not stale Spec Approval when they are inside approved scope and descend from base_workspace_revision.

  - approval: review
    subject:
      - review_bundle_digest
      - accepted_slice_set_digest
      - workspace_revision
      - review_entry_gate_set_digest
      - framework_pack_digest
      - policy_digest
      - environment_binding_digest
    invalidations:
      - change: source_test_or_slice_output
        result: stale
        nextStage: Implementing
        error: REVIEW_ACCEPTANCE_STALE
      - change: review_entry_gate_input
        result: stale
        nextStage: AwaitingHumanReview
        error: REVIEW_ACCEPTANCE_STALE
      - change: pack_policy_or_environment_relevant_to_review
        result: stale
        nextStage: AwaitingHumanReview
        error: REVIEW_ACCEPTANCE_STALE

  - approval: delivery
    subject:
      - delivery_manifest_draft_digest
      - workspace_revision
      - facts_revision_before
      - expected_facts_revision_after
      - acceptance_gate_set_digest
      - delivery_gate_set_digest
      - framework_pack_digest
      - policy_digest
      - environment_binding_digest
      - toolchain_digests
    invalidations:
      - change: any_delivery_manifest_input
        result: stale
        nextStage: AwaitingDeliveryApproval
        cancelOperation: facts_finalize
        error: DELIVERY_APPROVAL_STALE
      - change: facts_finalize_internal_progress_only
        result: keep
        condition: operation_inputs_match_approved_manifest
      - change: recovery_roll_forward_or_rollback
        result: keep
        condition: recovered_transaction_id_and_manifest_digest_match

revisionRules:
  environmentBinding:
    ownedBy: operator
    ordinaryFactChangeSetAllowed: false
  frameworkPackBinding:
    ownedBy: operator_or_core_maintainer
    ordinaryFactChangeSetAllowed: false
  policy:
    ownedBy: operator_or_policy_maintainer
    ordinaryFactChangeSetAllowed: false
