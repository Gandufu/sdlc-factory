apiVersion: sdlc.dev/domain-transitions/v1alpha1
kind: DomainTransitionMatrix

taskStages:
  - Draft
  - AwaitingSpecApproval
  - Implementing
  - AwaitingHumanReview
  - Accepting
  - AwaitingDeliveryApproval
  - Finalized
  - Cancelled

sliceStatuses:
  - Planned
  - Active
  - Candidate
  - Accepted
  - Cancelled

operationStatuses:
  - Pending
  - Running
  - Succeeded
  - Failed
  - Suspended
  - Cancelled

gateStatuses:
  - Pending
  - Running
  - Passed
  - Failed
  - Stale
  - Cancelled

stateSets:
  nonTerminal:
    - Draft
    - AwaitingSpecApproval
    - Implementing
    - AwaitingHumanReview
    - Accepting
    - AwaitingDeliveryApproval
  observable:
    - Draft
    - AwaitingSpecApproval
    - Implementing
    - AwaitingHumanReview
    - Accepting
    - AwaitingDeliveryApproval
    - Finalized
    - Cancelled

invariants:
  activeSuspensionLimit: 1
  suspensionHistory: append_only
  finalizedIsTerminal: true
  cancelledIsTerminal: true
  operationStatusIsOrthogonal: true
  gateStatusIsOrthogonal: true
  modelMayChooseTargetStage: false

commands:
  - command: task_open_new
    interface: agent
    action: sdlc_task_open
    actor: agent
    from: []
    guards:
      - id: no_active_writable_task
        error: ACTIVE_TASK_EXISTS
      - id: project_recovered
        error: PROJECT_RECOVERY_REQUIRED
    events:
      - TaskOpened
      - SlicePlanInitialized
    to: Draft

  - command: task_resume
    interface: agent
    action: sdlc_task_open
    actor: agent
    fromSet: observable
    guards:
      - id: task_exists
        error: TASK_NOT_FOUND
      - id: project_recovered
        error: PROJECT_RECOVERY_REQUIRED
    events:
      - TaskResumed
    to: unchanged

  - command: spec_validate
    interface: agent
    action: sdlc_spec_validate
    actor: agent
    from:
      - Draft
    guards:
      - id: no_active_suspension
        error: TASK_SUSPENDED
      - id: proposal_and_plan_valid
        error: SPEC_ARTIFACT_INVALID
      - id: fact_change_set_valid
        error: FACT_CHANGE_SET_INVALID
      - id: revision_current
        error: REVISION_DRIFT
    events:
      - SpecValidated
    to: AwaitingSpecApproval

  - command: approve_spec
    interface: operator
    action: approve_spec
    actor: operator
    from:
      - AwaitingSpecApproval
    guards:
      - id: operator_receipt_valid
        error: APPROVAL_RECEIPT_INVALID
      - id: spec_subject_current
        error: APPROVAL_SUBJECT_STALE
      - id: no_active_suspension
        error: TASK_SUSPENDED
    events:
      - SpecApproved
    to: Implementing

  - command: slice_activate
    interface: internal
    actor: application
    from:
      - Implementing
    sliceFrom:
      - Planned
    guards:
      - id: previous_slice_accepted_or_absent
        error: SLICE_ORDER_VIOLATION
      - id: no_active_suspension
        error: TASK_SUSPENDED
    events:
      - SliceActivated
    to: unchanged
    sliceTo: Active

  - command: observation_record
    interface: agent
    action: sdlc_observation_record
    actor: agent
    fromSet: nonTerminal
    guards:
      - id: observation_schema_valid
        error: OBSERVATION_INVALID
    events:
      - ObservationRecorded
    to: unchanged

  - command: slice_handoff_validate
    interface: internal
    actor: application
    from:
      - Implementing
    sliceFrom:
      - Active
    guards:
      - id: handoff_artifact_valid
        error: SLICE_HANDOFF_INVALID
      - id: slice_gate_set_passed
        error: GATE_SET_INCOMPLETE
      - id: result_revision_current
        error: REVISION_DRIFT
    events:
      - SliceCandidateRecorded
    to: unchanged
    sliceTo: Candidate

  - command: review_prepare
    interface: internal
    actor: application
    from:
      - Implementing
    guards:
      - id: all_slices_candidate
        error: SLICE_PLAN_INCOMPLETE
      - id: review_entry_gate_set_passed
        error: GATE_SET_INCOMPLETE
      - id: revision_current
        error: REVISION_DRIFT
    events:
      - HumanReviewRequested
    to: AwaitingHumanReview

  - command: accept_review
    interface: operator
    action: accept_review
    actor: operator
    from:
      - AwaitingHumanReview
    guards:
      - id: review_receipt_valid
        error: APPROVAL_RECEIPT_INVALID
      - id: review_subject_current
        error: APPROVAL_SUBJECT_STALE
      - id: no_active_suspension
        error: TASK_SUSPENDED
    events:
      - HumanReviewAccepted
      - SliceSetAccepted
    to: Accepting
    sliceTransition:
      from:
        - Candidate
      to: Accepted

  - command: gate_run_request
    interface: agent
    action: sdlc_gate_run
    actor: agent
    from:
      - Implementing
      - Accepting
    guards:
      - id: requested_gate_allowed_for_stage
        error: GATE_NOT_ALLOWED
      - id: gate_inputs_available
        error: GATE_INPUT_MISSING
      - id: no_active_suspension
        error: TASK_SUSPENDED
    events:
      - GateOperationAccepted
    to: unchanged

  - command: gate_operation_complete
    interface: internal
    actor: application
    from:
      - Implementing
      - Accepting
    guards:
      - id: operation_result_integrity_valid
        error: EVIDENCE_INTEGRITY_FAILED
    events:
      - GateRunRecorded
      - EvidenceAttached
    to: unchanged

  - command: delivery_prepare
    interface: agent
    action: sdlc_delivery_prepare
    actor: agent
    from:
      - Accepting
    guards:
      - id: all_slices_accepted
        error: SLICE_PLAN_INCOMPLETE
      - id: acceptance_and_delivery_gate_sets_passed
        error: GATE_SET_INCOMPLETE
      - id: delivery_manifest_draft_valid
        error: DELIVERY_MANIFEST_INVALID
      - id: revision_current
        error: REVISION_DRIFT
    events:
      - DeliveryPreviewPrepared
    to: AwaitingDeliveryApproval

  - command: approve_delivery
    interface: operator
    action: approve_delivery
    actor: operator
    from:
      - AwaitingDeliveryApproval
    guards:
      - id: delivery_receipt_valid
        error: APPROVAL_RECEIPT_INVALID
      - id: delivery_subject_current
        error: APPROVAL_SUBJECT_STALE
      - id: no_active_suspension
        error: TASK_SUSPENDED
    events:
      - DeliveryApproved
      - FactsFinalizeOperationRequested
    to: unchanged

  - command: facts_finalize_succeeded
    interface: internal
    actor: application
    from:
      - AwaitingDeliveryApproval
    guards:
      - id: delivery_approval_current
        error: APPROVAL_SUBJECT_STALE
      - id: facts_transaction_committed
        error: FACTS_FINALIZATION_INCOMPLETE
      - id: delivery_manifest_sealed
        error: DELIVERY_MANIFEST_INVALID
    events:
      - ProjectFactsPublished
      - DeliveryFinalized
    to: Finalized

  - command: facts_finalize_failed
    interface: internal
    actor: application
    from:
      - AwaitingDeliveryApproval
    guards:
      - id: finalization_failure_recorded
        error: FACTS_FINALIZATION_RESULT_MISSING
    events:
      - FactsFinalizationFailed
      - TaskSuspended
    to: unchanged
    suspension:
      category: storage
      resumeStage: AwaitingDeliveryApproval

  - command: suspend_task
    interface: operator_or_internal
    action: suspend_task
    actor:
      - operator
      - application
    fromSet: nonTerminal
    guards:
      - id: no_active_suspension
        error: ACTIVE_SUSPENSION_EXISTS
      - id: suspension_payload_complete
        error: SUSPENSION_INVALID
    events:
      - TaskSuspended
    to: unchanged

  - command: resume_task
    interface: operator
    action: resume_task
    actor: operator
    fromSet: nonTerminal
    guards:
      - id: active_suspension_exists
        error: SUSPENSION_NOT_FOUND
      - id: resume_decision_satisfied
        error: RESUME_DECISION_REQUIRED
      - id: resume_revision_current
        error: REVISION_DRIFT
    events:
      - TaskResumedFromSuspension
    to: "$resume_stage"

  - command: reconcile_revision
    interface: operator
    action: reconcile_revision
    actor: operator
    fromSet: nonTerminal
    guards:
      - id: revision_drift_exists
        error: REVISION_DRIFT_NOT_FOUND
      - id: reconciliation_subject_current
        error: APPROVAL_SUBJECT_STALE
      - id: reconciliation_decision_valid
        error: RECONCILIATION_INVALID
    events:
      - RevisionReconciled
      - GateInvalidationRecomputed
    to: unchanged

  - command: cancel_task
    interface: operator
    action: cancel_task
    actor: operator
    fromSet: nonTerminal
    guards:
      - id: cancellation_receipt_valid
        error: APPROVAL_RECEIPT_INVALID
    events:
      - TaskCancelled
      - WorkspaceDispositionRecorded
    to: Cancelled

operationCommands:
  - command: operation_create
    interface: internal
    actor: application
    from: []
    guards:
      - id: operation_subject_current
        error: REVISION_DRIFT
      - id: operation_kind_allowed
        error: OPERATION_NOT_ALLOWED
    events:
      - OperationCreated
    to: Pending

  - command: operation_start
    interface: internal
    actor: application
    from:
      - Pending
    guards:
      - id: lease_acquired
        error: OPERATION_LEASE_UNAVAILABLE
      - id: operation_inputs_current
        error: REVISION_DRIFT
      - id: required_enforcement_available_or_not_runner_operation
        error: CAPABILITY_NOT_ENFORCED
    events:
      - OperationStarted
    to: Running

  - command: operation_succeed
    interface: internal
    actor: application
    from:
      - Running
    guards:
      - id: execution_receipt_valid
        error: EXECUTION_RECEIPT_INVALID
      - id: cleanup_proven_or_not_required
        error: CLEANUP_UNPROVEN
    events:
      - OperationSucceeded
    to: Succeeded

  - command: operation_fail
    interface: internal
    actor: application
    from:
      - Running
    guards:
      - id: failure_diagnostic_complete
        error: FAILURE_DIAGNOSTIC_INVALID
      - id: cleanup_proven_or_suspended
        error: CLEANUP_UNPROVEN
    events:
      - OperationFailed
      - FailureRouted
    to: Failed

  - command: operation_suspend
    interface: internal
    actor: application
    from:
      - Pending
      - Running
    guards:
      - id: suspension_payload_complete
        error: SUSPENSION_INVALID
    events:
      - OperationSuspended
    to: Suspended

  - command: operation_resume
    interface: operator_or_internal
    actor:
      - operator
      - application
    from:
      - Suspended
    guards:
      - id: resume_decision_satisfied
        error: RESUME_DECISION_REQUIRED
      - id: operation_inputs_current
        error: REVISION_DRIFT
    events:
      - OperationResumed
    to: Pending

  - command: operation_cancel_request
    interface: operator
    action: cancel_operation
    actor: operator
    from:
      - Pending
      - Running
      - Suspended
    guards:
      - id: cancellation_receipt_valid
        error: APPROVAL_RECEIPT_INVALID
    events:
      - OperationCancellationRequested
    to: unchanged

  - command: operation_cancel_complete
    interface: internal
    actor: application
    from:
      - Pending
      - Running
      - Suspended
    guards:
      - id: cleanup_receipt_valid
        error: CLEANUP_UNPROVEN
    events:
      - OperationCancelled
    to: Cancelled

gateCommands:
  - command: gate_run_create
    interface: internal
    actor: application
    from: []
    guards:
      - id: gate_input_manifest_valid
        error: GATE_INPUT_MISSING
      - id: mandatory_gate_not_removed
        error: MANDATORY_GATE_MISSING
    events:
      - GateRunCreated
    to: Pending

  - command: gate_run_start
    interface: internal
    actor: application
    from:
      - Pending
    guards:
      - id: operation_running
        error: OPERATION_NOT_RUNNING
      - id: gate_inputs_current
        error: REVISION_DRIFT
    events:
      - GateRunStarted
    to: Running

  - command: gate_run_pass
    interface: internal
    actor: application
    from:
      - Running
    guards:
      - id: operation_succeeded
        error: OPERATION_RESULT_INVALID
      - id: evidence_integrity_valid
        error: EVIDENCE_INTEGRITY_FAILED
      - id: start_end_revision_match
        error: REVISION_DRIFT
    events:
      - GateRunPassed
    to: Passed

  - command: gate_run_fail
    interface: internal
    actor: application
    from:
      - Running
    guards:
      - id: operation_terminal_failure
        error: OPERATION_RESULT_INVALID
      - id: failure_diagnostic_complete
        error: FAILURE_DIAGNOSTIC_INVALID
    events:
      - GateRunFailed
      - FailureRouted
    to: Failed

  - command: gate_run_stale
    interface: internal
    actor: application
    from:
      - Pending
      - Running
      - Passed
      - Failed
    guards:
      - id: input_digest_changed_or_unknown
        error: GATE_INPUT_UNCHANGED
    events:
      - GateRunStaled
      - ActiveGateOperationCancellationRequested
    to: Stale

  - command: gate_run_cancel
    interface: internal
    actor: application
    from:
      - Pending
      - Running
    guards:
      - id: operation_cancelled_or_not_started
        error: OPERATION_NOT_CANCELLED
    events:
      - GateRunCancelled
    to: Cancelled
