apiVersion: sdlc.dev/failure-routing/v1alpha1
kind: FailureRoutingMatrix

requiredDiagnosticFields:
  - category
  - fault_origin
  - repair_scope
  - responsible_actor
  - retryability
  - resume_stage
  - fingerprint
  - evidence_refs

routes:
  - category: product
    origins:
      - product_code
    responsibleActor: agent
    retryability: after_change
    targetStage: Implementing
    attemptBudgetClass: product

  - category: spec
    origins:
      - requirement
      - acceptance_criteria
      - architecture
    responsibleActor: agent
    retryability: after_change
    targetStage: Draft
    invalidate:
      - spec
      - review
      - delivery

  - category: test_contract
    origins:
      - project_test
      - fixture
    responsibleActor: agent
    retryability: after_change
    targetStage: Implementing
    requiredRepairScope: tests_only
    attemptBudgetClass: test_contract

  - category: test_contract
    origins:
      - framework_pack
      - parser
    responsibleActor: pack_maintainer
    retryability: manual_only
    action: suspend
    requiredRepairScope: pack_or_parser
    productWriteAllowed: false

  - category: environment
    origins:
      - endpoint
      - device
      - port
      - secret_binding
      - test_data
    responsibleActor: operator
    retryability: manual_only
    action: suspend
    preserveResumeStage: true
    attemptBudgetClass: environment

  - category: policy
    origins:
      - protected_path
      - license
      - security_policy
      - capability_not_enforced
    responsibleActor: operator
    retryability: manual_only
    action: suspend
    preserveResumeStage: true

  - category: infrastructure
    origins:
      - runner
      - filesystem
      - transient_network
      - supervisor
    responsibleActor: core_maintainer
    retryability: transient
    transientRetryLimit: 1
    onBudgetExceeded: suspend
    attemptBudgetClass: infrastructure
    consumesProductAttemptBudget: false

  - category: revision
    origins:
      - workspace_drift
      - facts_drift
      - binding_drift
    responsibleActor: operator
    retryability: manual_only
    action: suspend
    invalidateByMatrix: true

  - category: budget
    origins:
      - attempt_limit
      - time_limit
      - token_limit
      - repeated_failure
    responsibleActor: operator
    retryability: manual_only
    action: suspend
    preserveResumeStage: true
    requireScopeOrBudgetDecision: true

  - category: storage
    origins:
      - recovery_ambiguous
      - integrity_failed
      - facts_finalization
    responsibleActor: core_maintainer
    retryability: manual_only
    action: suspend
    failClosed: true

  - category: unknown
    origins:
      - unclassified
    responsibleActor: core_maintainer
    retryability: manual_only
    diagnosticAttemptLimit: 1
    onBudgetExceeded: suspend

deduplication:
  repeatedFingerprintLimit: 2
  requireFailureDeltaForRetry: true
  failureDeltaKinds:
    - new_case
    - new_stack
    - new_localization
    - new_environment_state
    - new_hypothesis_result
